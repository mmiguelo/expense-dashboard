name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Applies the migrations to a throwaway local Supabase and runs the database tests:
  # RLS and roles (pgTAP), the API and the page end to end, and the HTTP security check.
  # Nothing deploys if they fail.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - name: Row Level Security and role tests (pgTAP)
        run: npx supabase test db
      - name: API and end-to-end tests
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|DB_URL)=')"
          SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_ANON_KEY="$PUBLISHABLE_KEY" SUPABASE_TEST_DB_URL="$DB_URL" npm run test:db
      - name: Security check over plain HTTP
        run: ./scripts/security-check.sh

  build:
    runs-on: ubuntu-latest
    env:
      # Public values, set as repository variables (Settings > Secrets and variables >
      # Actions > Variables). Never the service role / secret key.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Check Supabase settings
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository variables. The live site was left unchanged."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [db-tests, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
